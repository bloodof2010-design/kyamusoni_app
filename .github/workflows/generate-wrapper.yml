name: Generate Gradle 8.13 Wrapper

on:
  workflow_dispatch:

jobs:
  wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Download Gradle 8.13
        run: |
          set -e

          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip

          echo "$GITHUB_WORKSPACE/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Create clean Gradle project
        run: |
          set -e

          rm -rf /tmp/wrapper-project
          mkdir -p /tmp/wrapper-project

          cd /tmp/wrapper-project

          printf '%s\n' \
            'rootProject.name = "wrapper-project"' \
            > settings.gradle

          printf '%s\n' \
            'tasks.register("dummy")' \
            > build.gradle

      - name: Generate Gradle 8.13 wrapper
        run: |
          set -e

          cd /tmp/wrapper-project

          gradle wrapper \
            --gradle-version 8.13 \
            --distribution-type bin

      - name: Verify wrapper
        run: |
          set -e

          echo "========================================"
          echo "       WRAPPER VERIFICATION"
          echo "========================================"

          ls -lh \
            /tmp/wrapper-project/gradlew \
            /tmp/wrapper-project/gradlew.bat \
            /tmp/wrapper-project/gradle/wrapper/gradle-wrapper.jar \
            /tmp/wrapper-project/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "===== GRADLE VERSION ====="

          cd /tmp/wrapper-project
          ./gradlew --version

      - name: Package wrapper
        run: |
          set -e

          rm -rf wrapper-output

          mkdir -p wrapper-output/gradle/wrapper

          cp /tmp/wrapper-project/gradlew \
            wrapper-output/gradlew

          cp /tmp/wrapper-project/gradlew.bat \
            wrapper-output/gradlew.bat

          cp /tmp/wrapper-project/gradle/wrapper/gradle-wrapper.jar \
            wrapper-output/gradle/wrapper/gradle-wrapper.jar

          cp /tmp/wrapper-project/gradle/wrapper/gradle-wrapper.properties \
            wrapper-output/gradle/wrapper/gradle-wrapper.properties

      - name: Verify artifact files
        run: |
          set -e

          echo "===== FINAL WRAPPER ====="

          find wrapper-output -type f -print

          echo ""
          echo "===== JAR CHECKSUM ====="

          sha256sum \
            wrapper-output/gradle/wrapper/gradle-wrapper.jar

      - name: Upload Gradle 8.13 wrapper
        uses: actions/upload-artifact@v4
        with:
          name: gradle-8.13-wrapper
          path: wrapper-output/
          if-no-files-found: error
