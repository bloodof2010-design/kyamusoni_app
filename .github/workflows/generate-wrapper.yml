name: Generate Gradle 8.13 Wrapper

on:
  workflow_dispatch:

jobs:
  wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Create temporary Gradle project
        run: |
          mkdir -p wrapper-project
          cd wrapper-project

          printf '%s\n' \
            'plugins {' \
            '}' \
            > build.gradle

          gradle wrapper \
            --gradle-version 8.13 \
            --distribution-type bin

      - name: Copy wrapper files
        run: |
          set -e

          mkdir -p android/gradle/wrapper

          cp wrapper-project/gradlew android/gradlew
          cp wrapper-project/gradlew.bat android/gradlew.bat
          cp wrapper-project/gradle/wrapper/gradle-wrapper.jar \
            android/gradle/wrapper/gradle-wrapper.jar

          chmod +x android/gradlew

          cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Verify wrapper
        run: |
          set -e

          echo "===== WRAPPER FILES ====="
          ls -lh \
            android/gradlew \
            android/gradlew.bat \
            android/gradle/wrapper/gradle-wrapper.jar \
            android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "===== JAR CHECKSUM ====="
          sha256sum android/gradle/wrapper/gradle-wrapper.jar

          echo ""
          echo "===== WRAPPER VERSION ====="
          cd android
          ./gradlew --version

      - name: Upload wrapper files
        uses: actions/upload-artifact@v4
        with:
          name: gradle-8.13-wrapper
          path: |
            android/gradlew
            android/gradlew.bat
            android/gradle/wrapper/gradle-wrapper.jar
            android/gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
