name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Clean
        run: flutter clean

      - name: Get dependencies again
        run: flutter pub get

      - name: Build APK
        id: build_apk
        continue-on-error: true
        run: |
          set +e

          echo "===== BUILD START ====="

          flutter build apk --release -v -- --stacktrace --info \
            > android_build.log 2>&1

          EXIT_CODE=$?

          echo "===== BUILD EXIT CODE: $EXIT_CODE ====="

          echo "===== LAST 200 LINES ====="
          tail -n 200 android_build.log

          exit $EXIT_CODE

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android_build.log
          if-no-files-found: warn

      - name: Find all APK files
        if: always()
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print

          echo "===== BUILD DIRECTORY ====="
          find build -maxdepth 5 -type f -print 2>/dev/null || true

      - name: Show failure summary
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo "========================================"
          echo "APK BUILD FAILED"
          echo "========================================"

          echo "===== GRADLE FAILURE ====="
          grep -n -A 40 -B 10 \
            -E "FAILURE: Build failed|What went wrong|Where:|Caused by:|Exception|Execution failed" \
            android_build.log | tail -n 250 || true

          echo "========================================"
          echo "FULL LOG IS AVAILABLE AS ARTIFACT:"
          echo "android-build-log"
          echo "========================================"

      - name: Fail workflow if build failed
        if: steps.build_apk.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release-unsigned.apk
          if-no-files-found: error
