name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate Gradle Wrapper and gradle-wrapper.jar
        run: |
          cd android
          gradle wrapper --gradle-version 9.5
          chmod +x gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          echo "Gradle wrapper JAR created successfully."

      - name: Build Android APK
        run: |
          export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false"
          set +e

          echo "===== BUILDING WITH GRADLE WRAPPER ====="
          cd android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace > ../build.log 2>&1
          GRADLE_STATUS=$?
          cd ..

          echo "===== ERROR REPORT ====="
          grep -n -E "FAILURE:|What went wrong:|Execution failed|AAPT: error:|Android resource linking failed|Could not|Error:|Caused by:" build.log | tail -100 || true

          echo "===== APK DISCOVERY REPORT ====="
          find . -type f -name "*.apk" -exec ls -lh {} + 2>/dev/null || true

          echo "Gradle build exit code: $GRADLE_STATUS"

          if [ "$GRADLE_STATUS" -ne 0 ]; then
            echo "===== LAST 100 BUILD LINES ====="
            tail -100 build.log
            exit "$GRADLE_STATUS"
          fi

      - name: Collect APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: |
            android/app/build/outputs/**/*.apk
          if-no-files-found: error
