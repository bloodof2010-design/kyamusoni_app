name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons || true

      - name: Build APK
        run: |
          export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false"
          set +e

          echo "===== ATTEMPTING FLUTTER APK BUILD ====="
          flutter build apk --release --no-tree-shake-icons --verbose
          BUILD_STATUS=$?
          echo "Flutter build exit code: $BUILD_STATUS"

          # If flutter build apk failed or didn't produce APK, fallback to Gradle wrapper
          APK_COUNT=$(find . -type f -name "*.apk" 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -eq 0 ] && [ -d "android" ]; then
            echo "===== FALLBACK: BUILDING DIRECTLY WITH GRADLE WRAPPER ====="
            cd android
            if [ -f "gradlew" ]; then
              chmod +x gradlew
              ./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace || true
            fi
            cd ..
          fi

          echo "===== FULL APK DISCOVERY REPORT ====="
          find . -type f -name "*.apk" -exec ls -lh {} + 2>/dev/null || true
          FINAL_APK_COUNT=$(find . -type f -name "*.apk" 2>/dev/null | wc -l)
          echo "Total APKs found: $FINAL_APK_COUNT"

          if [ "$FINAL_APK_COUNT" -eq 0 ]; then
            echo "===== DIAGNOSTIC DIRECTORY TREE ====="
            ls -laR build/ 2>/dev/null || true
            ls -laR android/app/build/ 2>/dev/null || true
            echo "Build failed to generate any APK."
            exit 1
          fi

      - name: Collect APK
        uses: actions/upload-artifact@v4
        with:
          name: kyamusoni-release-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
