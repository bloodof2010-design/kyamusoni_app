      name: Build signed release APK
        run:
          cd android
          chmod +x gradlew

          ./gradlew app:assembleRelease \
            --stacktrace \
            --no-daemon \
            2>&1 | tee ../gradle-build.log

          EXIT_CODE=${PIPESTATUS[0]}

          cd ..

          echo "========================================"
          echo "           GRADLE BUILD RESULT"
          echo "========================================"
          echo "Exit code: $EXIT_CODE"
          echo ""

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "===== IMPORTANT GRADLE ERRORS ====="
            grep -n -E \
              "FAILURE:|What went wrong:|Execution failed|Caused by:|KeytoolException|Given final block|BUILD FAILED|Could not|Error:" \
              gradle-build.log | tail -n 100 || true

            echo ""
            echo "===== LAST 100 LINES ====="
            tail -n 100 gradle-build.log

            exit "$EXIT_CODE"
          fi
