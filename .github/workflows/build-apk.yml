name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Dependencies
        run: flutter pub get

      - name: Launcher icon
        run: dart run flutter_launcher_icons

      - name: Clean
        run: flutter clean

      - name: Dependencies again
        run: flutter pub get

      - name: Create signing key
        run: |
          rm -f android/release-key.jks
          rm -f android/key.properties

          keytool -genkeypair -v \
            -keystore android/release-key.jks \
            -alias kyamusoni \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass KyamusoniStore2026 \
            -keypass KyamusoniStore2026 \
            -dname "CN=Kyamusoni, OU=Mobile, O=Kyamusoni, L=Kampala, ST=Central, C=UG"

      - name: Verify signing key
        run: |
          keytool -list \
            -v \
            -keystore android/release-key.jks \
            -storepass KyamusoniStore2026 \
            -alias kyamusoni

      - name: Create signing properties
        run: |
          printf '%s\n' \
            'storePassword=KyamusoniStore2026' \
            'keyPassword=KyamusoniStore2026' \
            'keyAlias=kyamusoni' \
            'storeFile=release-key.jks' \
            > android/key.properties

      - name: Build APK - FORCE ERROR OUTPUT
        id: build_apk
        continue-on-error: true
        run: |
          set +e

          echo "========================================"
          echo "       STARTING FLUTTER APK BUILD"
          echo "========================================"

          echo "::group::FULL FLUTTER BUILD"

          flutter build apk \
            --release \
            --target-platform android-arm \
            --split-per-abi \
            --verbose 2>&1 | tee build.log

          CODE=${PIPESTATUS[0]}

          echo "::endgroup::"

          echo ""
          echo "========================================"
          echo "       BUILD EXIT CODE: $CODE"
          echo "========================================"

          if [ "$CODE" -ne 0 ]; then
            echo "::error title=Flutter APK Build Failed::Flutter exited with code $CODE"

            echo ""
            echo "===== LAST 500 LINES ====="
            tail -n 500 build.log || true

            exit "$CODE"
          fi

      - name: FORCE ERROR REPORT
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo "========================================"
          echo "       FORCED BUILD ERROR REPORT"
          echo "========================================"

          if [ -f build.log ]; then

            echo ""
            echo "===== FIRST IMPORTANT ERRORS ====="

            grep -n -E \
              'FAILURE:|What went wrong:|Execution failed for task|Caused by:|BUILD FAILED|KeytoolException|Exception:|A problem occurred|Task .* FAILED|ERROR:' \
              build.log | head -n 50 || true

            echo ""
            echo "===== GRADLE FAILURE CONTEXT ====="

            awk '
              /FAILURE:/ {show=1}
              show {print}
              show && /BUILD FAILED/ {exit}
            ' build.log || true

            echo ""
            echo "===== LAST 500 LINES ====="
            tail -n 500 build.log

            echo ""
            echo "===== WRITING ERROR TO GITHUB SUMMARY ====="

            {
              echo "## ❌ Kyamusoni APK Build Failed"
              echo ""
              echo "### Important errors"
              echo '```text'

              grep -n -E \
                'FAILURE:|What went wrong:|Execution failed for task|Caused by:|BUILD FAILED|KeytoolException|Exception:|A problem occurred|Task .* FAILED|ERROR:' \
                build.log | head -n 100 || true

              echo '```'
              echo ""
              echo "### Last 100 lines"
              echo '```text'
              tail -n 100 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

          else
            echo "::error title=Missing build log::build.log was not created"
            echo "ERROR: build.log was not created."
          fi

          echo ""
          echo "========================================"
          echo "       END OF BUILD ERROR REPORT"
          echo "========================================"

          exit 1

      - name: Find armeabi-v7a APK
        run: |
          echo "===== GENERATED APK FILES ====="
          find . -type f -name '*.apk' -print

          APK="build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: armeabi-v7a APK was not generated."
            echo "===== ALL BUILD FILES ====="
            find build -type f -print 2>/dev/null || true
            exit 1
          fi

          mkdir -p final-apk

          cp "$APK" final-apk/app-armeabi-v7a-release.apk

          echo "===== FINAL APK ====="
          ls -lh final-apk/app-armeabi-v7a-release.apk

      - name: Verify APK signature
        run: |
          APK="final-apk/app-armeabi-v7a-release.apk"

          echo "===== VERIFYING APK SIGNATURE ====="

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: kyamusoni-armeabi-v7a-release
          path: final-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
