name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Clean Flutter
        run: flutter clean

      - name: Get dependencies again
        run: flutter pub get

      - name: Remove old signing files
        run: |
          rm -f android/release-key.jks
          rm -f android/key.properties

      - name: Create release keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore android/release-key.jks \
            -alias kyamusoni \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "KyamusoniStore2026" \
            -keypass "KyamusoniStore2026" \
            -dname "CN=Kyamusoni, OU=Mobile, O=Kyamusoni, L=Kampala, ST=Central, C=UG"

      - name: Verify keystore
        run: |
          keytool -list \
            -keystore android/release-key.jks \
            -storepass "KyamusoniStore2026" \
            -alias kyamusoni

      - name: Create key properties
        run: |
          cat > android/key.properties <<'EOF'
          storePassword=KyamusoniStore2026
          keyPassword=KyamusoniStore2026
          keyAlias=kyamusoni
          storeFile=release-key.jks
          EOF

      - name: Build signed release APK
        run: |
          cd android
          chmod +x gradlew

          set +e

          ./gradlew app:assembleRelease \
            --stacktrace \
            --no-daemon \
            2>&1 | tee ../gradle-build.log

          EXIT_CODE=${PIPESTATUS[0]}

          cd ..

          echo "========================================"
          echo "           GRADLE BUILD RESULT"
          echo "========================================"
          echo "Exit code: $EXIT_CODE"
          echo ""

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "===== IMPORTANT GRADLE ERRORS ====="
            grep -n -E \
              "FAILURE:|What went wrong:|Execution failed|Caused by:|KeytoolException|Given final block|BUILD FAILED|Could not|Error:" \
              gradle-build.log | tail -n 100 || true

            echo ""
            echo "===== LAST 100 LINES ====="
            tail -n 100 gradle-build.log

            exit "$EXIT_CODE"
          fi

      - name: Find generated APK
        run: |
          echo "===== GENERATED APK FILES ====="
          find . -type f -name "*.apk" -print

          APK=$(find android/app/build/outputs -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            echo "===== BUILD FILES ====="
            find android/app/build -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "APK FOUND: $APK"

          mkdir -p build/app/outputs/flutter-apk/final

          cp "$APK" \
            build/app/outputs/flutter-apk/final/app-armeabi-v7a-release.apk

          ls -lh build/app/outputs/flutter-apk/final/app-armeabi-v7a-release.apk

      - name: Verify APK signature
        run: |
          APK="build/app/outputs/flutter-apk/final/app-armeabi-v7a-release.apk"

          echo "===== APK SIGNATURE ====="

          jarsigner -verify -verbose -certs "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: kyamusoni-armeabi-v7a-release
          path: build/app/outputs/flutter-apk/final/app-armeabi-v7a-release.apk
          if-no-files-found: error
