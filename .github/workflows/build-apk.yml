name: Build Kyamusoni Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create local.properties
        run: |
          cat > android/local.properties <<EOF
          flutter.sdk=$FLUTTER_ROOT
          sdk.dir=$ANDROID_HOME
          flutter.versionCode=1
          flutter.versionName=1.0
          EOF

      - name: Configure Gradle
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.enableR8.fullMode=false
          EOF

      - name: Create release keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore android/app/kyamusoni-release.jks \
            -alias kyamusoni \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass kyamusoni123 \
            -keypass kyamusoni123 \
            -dname "CN=Kyamusoni, OU=Kyamusoni, O=Kyamusoni, L=Kampala, ST=Central, C=UG"

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=kyamusoni123
          keyPassword=kyamusoni123
          keyAlias=kyamusoni
          storeFile=kyamusoni-release.jks
          EOF

      - name: Verify signing files
        run: |
          echo "Checking keystore..."
          ls -lh android/app/kyamusoni-release.jks
          echo "Checking key.properties..."
          cat android/key.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Clean
        run: flutter clean

      - name: Get dependencies again
        run: flutter pub get

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Verify APK exists
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not created."
            exit 1
          fi

          ls -lh "$APK"

      - name: Verify APK signature
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            | sort -V \
            | tail -n 1)

          echo "Using apksigner:"
          echo "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"

      - name: Prepare final APK
        run: |
          set -e

          mkdir -p final-apk

          cp build/app/outputs/flutter-apk/app-release.apk \
            final-apk/kyamusoni-release-signed.apk

          ls -lh final-apk/kyamusoni-release-signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: kyamusoni-release-signed
          path: final-apk/kyamusoni-release-signed.apk
          if-no-files-found: error
