      - name: Build APK
        id: build_apk
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release --verbose 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Report build error
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo "========================================"
          echo "           APK BUILD FAILED"
          echo "========================================"
          echo ""
          echo "===== LAST 150 LINES ====="
          tail -n 150 build.log
          echo ""
          echo "===== ERRORS / FAILURES ====="
          grep -n -E "FAILURE:|What went wrong:|Execution failed|BUILD FAILED|Error:|ERROR|Exception:" build.log | tail -n 100 || true
          echo ""
          echo "========================================"
          exit 1
