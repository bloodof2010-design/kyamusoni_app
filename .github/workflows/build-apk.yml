name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Force fix gradle.properties
        run: |
          rm -rf ~/.gradle
          rm -rf android/.gradle
          rm -rf gradle.properties
          mkdir -p android
          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4G
          android.useAndroidX=true
          android.enableRtl=true
          EOF
          echo "FIXED FILE:"
          cat android/gradle.properties
          
          # also fix local.properties for old error
          echo "flutter.sdk=$(dirname $(dirname $(which flutter)))" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties
          echo "flutter.versionName=1.0" >> android/local.properties

      - run: flutter clean
      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-old-phone
          path: build/app/outputs/flutter-apk/app-release.apk
