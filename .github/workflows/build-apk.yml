name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Dependencies
        run: flutter pub get

      - name: Launcher icon
        run: dart run flutter_launcher_icons

      - name: Clean
        run: flutter clean

      - name: Dependencies again
        run: flutter pub get

      - name: Create signing key
        run: |
          rm -f android/release-key.jks
          rm -f android/key.properties
          keytool -genkeypair -v \
            -keystore android/release-key.jks \
            -alias kyamusoni \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass KyamusoniStore2026 \
            -keypass KyamusoniStore2026 \
            -dname "CN=Kyamusoni, OU=Mobile, O=Kyamusoni, L=Kampala, ST=Central, C=UG"

      - name: Signing properties
        run: |
          printf '%s\n' \
            'storePassword=KyamusoniStore2026' \
            'keyPassword=KyamusoniStore2026' \
            'keyAlias=kyamusoni' \
            'storeFile=release-key.jks' \
            > android/key.properties

      - name: Build APK
        run: |
          set +e
          flutter build apk --release --target-platform android-arm --split-per-abi --verbose > build.log 2>&1
          code=$?

          echo "===== BUILD EXIT CODE: $code ====="

          if [ "$code" -ne 0 ]; then
            echo "===== BUILD FAILED ====="
            echo "===== MATCHED ERRORS ====="
            grep -n -E 'FAILURE:|What went wrong:|Execution failed|Caused by:|KeytoolException|BUILD FAILED|Could not|Error:|Exception:' build.log | tail -n 100 || true
            echo "===== LAST 200 LINES ====="
            tail -n 200 build.log
            exit "$code"
          fi

          echo "===== BUILD SUCCEEDED ====="
          find build -type f -name '*.apk' -print

      - name: Prepare APK
        run: |
          APK="build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: $APK not found"
            echo "===== ALL APK FILES ====="
            find . -type f -name '*.apk' -print
            exit 1
          fi

          mkdir -p final-apk
          cp "$APK" final-apk/app-armeabi-v7a-release.apk

      - name: Verify signature
        run: |
          jarsigner -verify -verbose -certs final-apk/app-armeabi-v7a-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kyamusoni-armeabi-v7a-release
          path: final-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
