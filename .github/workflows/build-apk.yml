name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: |
          set +e
          flutter build apk --release > build.log 2>&1
          status=$?

          echo "===== BUILD RESULT ====="
          echo "Exit code: $status"

          echo "===== IMPORTANT ERRORS ====="
          grep -n -E "FAILURE:|What went wrong:|Execution failed|Android resource linking failed|AAPT: error:|Error:|Caused by:" build.log | tail -50 || true

          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print || true

          if [ $status -ne 0 ]; then
            echo "===== LAST 100 BUILD LINES ====="
            tail -100 build.log
            exit $status
          fi
