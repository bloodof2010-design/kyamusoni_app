      name: Build APK
        run:set +e
          chmod +x android/gradlew
          android/gradlew -p android app:assembleRelease --stacktrace > build.log 2>&1
          status=$?

          echo "===== ERROR REPORT ====="
          grep -n -E "FAILURE:|What went wrong:|Execution failed|AAPT: error:|Android resource linking failed|Could not|Error:|Caused by:" build.log | tail -100 || true

          echo "===== APK REPORT ====="
          find android/app/build -type f -name "*.apk" -print || true

          echo "===== EXIT CODE ====="
          echo "$status"

          if [ $status -ne 0 ]; then
            echo "===== LAST 100 LINES ====="
            tail -100 build.log
            exit $status
          fi

      - name: Collect APK
        uses: actions/upload-artifact@v4
        with:
          name: kyamusoni-release-apk
          path: android/app/build/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
