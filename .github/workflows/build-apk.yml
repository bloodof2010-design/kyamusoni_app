name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Dependencies
        run: flutter pub get

      - name: Launcher icon
        run: dart run flutter_launcher_icons

      - name: Clean
        run: flutter clean

      - name: Dependencies again
        run: flutter pub get

      - name: Create signing key
        run: |
          rm -f android/release-key.jks
          rm -f android/key.properties

          keytool -genkeypair -v \
            -keystore android/release-key.jks \
            -alias kyamusoni \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass KyamusoniStore2026 \
            -keypass KyamusoniStore2026 \
            -dname "CN=Kyamusoni, OU=Mobile, O=Kyamusoni, L=Kampala, ST=Central, C=UG"

      - name: Signing properties
        run: |
          printf '%s\n' \
            'storePassword=KyamusoniStore2026' \
            'keyPassword=KyamusoniStore2026' \
            'keyAlias=kyamusoni' \
            'storeFile=release-key.jks' \
            > android/key.properties

      - name: Build APK
        run: |
          set +e

          flutter build apk \
            --release \
            --target-platform android-arm \
            --split-per-abi \
            --verbose > build.log 2>&1

          code=$?

          echo ""
          echo "========================================"
          echo "        BUILD EXIT CODE: $code"
          echo "========================================"
          echo ""

          if [ "$code" -ne 0 ]; then
            echo "========================================"
            echo "           BUILD FAILED"
            echo "========================================"
            echo ""

            echo "===== MATCHED ERRORS ====="
            if [ -f build.log ]; then
              grep -n -E \
                'FAILURE:|What went wrong:|Execution failed|Caused by:|KeytoolException|BUILD FAILED|Could not|Error:|Exception:|A problem occurred' \
                build.log | tail -n 100 || true
            else
              echo "ERROR: build.log was not created."
            fi

            echo ""
            echo "===== LAST 200 LINES ====="
            if [ -f build.log ]; then
              tail -n 200 build.log
            else
              echo "No build.log available."
            fi

            echo ""
            echo "========================================"
            echo "       END OF ERROR REPORT"
            echo "========================================"

            exit "$code"
          fi

          echo "========================================"
          echo "          BUILD SUCCEEDED"
          echo "========================================"

          find build -type f -name '*.apk' -print

      - name: Prepare APK
        run: |
          APK="build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: $APK not found"
            echo "===== ALL APK FILES ====="
            find . -type f -name '*.apk' -print
            exit 1
          fi

          mkdir -p final-apk

          cp "$APK" \
            final-apk/app-armeabi-v7a-release.apk

          echo "===== FINAL APK ====="
          ls -lh final-apk/app-armeabi-v7a-release.apk

      - name: Verify signature
        run: |
          echo "===== VERIFYING APK SIGNATURE ====="

          jarsigner -verify \
            -verbose \
            -certs \
            final-apk/app-armeabi-v7a-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kyamusoni-armeabi-v7a-release
          path: final-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
