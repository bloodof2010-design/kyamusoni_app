name: Build Kyamusoni Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create local.properties
        run: |
          cat > android/local.properties <<EOF
          flutter.sdk=$FLUTTER_ROOT
          sdk.dir=$ANDROID_HOME
          flutter.versionCode=1
          flutter.versionName=1.0
          EOF

      - name: Configure Gradle
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.enableR8.fullMode=false
          EOF

      - name: Create release keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore android/app/kyamusoni-release.jks \
            -alias kyamusoni \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass kyamusoni123 \
            -keypass kyamusoni123 \
            -dname "CN=Kyamusoni, OU=Kyamusoni, O=Kyamusoni, L=Kampala, ST=Central, C=UG"

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=kyamusoni123
          keyPassword=kyamusoni123
          keyAlias=kyamusoni
          storeFile=kyamusoni-release.jks
          EOF

      - name: Verify signing files
        run: |
          echo "Checking keystore..."
          ls -lh android/app/kyamusoni-release.jks

          echo "Checking key.properties..."
          cat android/key.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Clean Flutter
        run: flutter clean

      - name: Get dependencies again
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --verbose

      - name: Locate generated APK
        if: always()
        run: |
          echo "===== Searching for APK files ====="

          find . -type f -name "*.apk" -print

          echo "===== Flutter APK directory ====="

          if [ -d "build/app/outputs/flutter-apk" ]; then
            ls -lah build/app/outputs/flutter-apk/
          fi

          echo "===== Android outputs ====="

          if [ -d "android/app/build/outputs" ]; then
            find android/app/build/outputs -type f -print
          fi

      - name: Find release APK
        id: find_apk
        run: |
          set -e

          APK=$(find . -type f -name "app-release.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No app-release.apk was found."
            exit 1
          fi

          echo "Found APK:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

          ls -lh "$APK"

      - name: Verify APK signature
        run: |
          set -e

          APK="${{ steps.find_apk.outputs.apk_path }}"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            | sort -V \
            | tail -n 1)

          echo "Using apksigner:"
          echo "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"

      - name: Prepare final APK
        run: |
          set -e

          mkdir -p final-apk

          cp "${{ steps.find_apk.outputs.apk_path }}" \
            final-apk/kyamusoni-release-signed.apk

          ls -lh final-apk/kyamusoni-release-signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: kyamusoni-release-signed
          path: final-apk/kyamusoni-release-signed.apk
          if-no-files-found: error
