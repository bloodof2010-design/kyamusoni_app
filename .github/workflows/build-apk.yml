name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - run: |
          pwd
          ls -la
          ls -la android/ || echo "no android at root"
          ls -la kyamusoni_app/android/ || echo "no nested android"
          find . -name "settings.gradle" -type f

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: |
          which flutter
          FLUTTER_SDK=$(dirname $(dirname $(which flutter)))
          echo "Creating file at $(pwd)/android/local.properties"
          mkdir -p android
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties
          echo "flutter.versionName=1.0" >> android/local.properties
          cat android/local.properties
          # also create nested if needed
          mkdir -p kyamusoni_app/android || true
          cp android/local.properties kyamusoni_app/android/ 2>/dev/null || true
          
      - run: flutter build apk --release
          
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: "**/app-release.apk"
