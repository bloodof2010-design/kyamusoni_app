-name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create local.properties
        run: |
          cat > android/local.properties <<EOF
          flutter.sdk=$FLUTTER_ROOT
          sdk.dir=$ANDROID_HOME
          flutter.versionCode=1
          flutter.versionName=1.0
          EOF

      - name: Configure Gradle
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.enableRtl=true
          EOF

      - name: Make Gradle wrapper executable
        run: |
          chmod +x android/gradlew

      - name: Get dependencies
        run: flutter pub get

      - name: Clean
        run: flutter clean

      - name: Get dependencies again
        run: flutter pub get

      - name: Build release APK
        run: |
          cd android
          ./gradlew app:assembleRelease --stacktrace --no-daemon

      - name: Prepare APK
        run: |
          set -e

          mkdir -p final-apk

          cp android/app/build/outputs/apk/release/app-release.apk \
            final-apk/kyamusoni-release.apk

          ls -lh final-apk/kyamusoni-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kyamusoni-release-apk
          path: final-apk/kyamusoni-release.apk
          if-no-files-found: error
