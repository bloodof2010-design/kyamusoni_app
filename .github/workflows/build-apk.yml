name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew 2>/dev/null || true
          chmod +x android/gradlew 2>/dev/null || true

      - name: Build Android APK
        run: |
          export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false"
          set +e

          echo "===== BUILDING WITH GRADLE WRAPPER ====="
          ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace
          GRADLE_STATUS=$?
          echo "Gradle build exit code: $GRADLE_STATUS"

          echo "===== FULL APK DISCOVERY REPORT ====="
          find . -type f -name "*.apk" -exec ls -lh {} + 2>/dev/null || true
          TOTAL_APKS=$(find . -type f -name "*.apk" 2>/dev/null | wc -l)
          echo "Total APKs found: $TOTAL_APKS"

          if [ "$TOTAL_APKS" -eq 0 ]; then
            echo "ERROR: No APK files were generated."
            exit 1
          fi

      - name: Collect APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: |
            app/build/outputs/apk/**/*.apk
            **/outputs/**/*.apk
            **/*.apk
          if-no-files-found: error
