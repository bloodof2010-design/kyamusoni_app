      - name: Build signed release APK
        run: |
          set +e

          echo "===== CHECKING ANDROID PROJECT ====="
          ls -la android
          echo ""

          echo "===== REGENERATING GRADLE WRAPPER ====="
          flutter pub get
          flutter build apk --release --target-platform android-arm --split-per-abi --verbose \
            2>&1 | tee gradle-build.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "           GRADLE BUILD RESULT"
          echo "========================================"
          echo "Exit code: $EXIT_CODE"
          echo ""

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "===== IMPORTANT ERRORS ====="
            grep -n -E \
              "FAILURE:|What went wrong:|Execution failed|Caused by:|KeytoolException|Given final block|BUILD FAILED|Could not|Error:|Exception:" \
              gradle-build.log | tail -n 100 || true

            echo ""
            echo "===== LAST 150 LINES ====="
            tail -n 150 gradle-build.log

            exit "$EXIT_CODE"
          fi
