name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Clean Flutter
        run: flutter clean

      - name: Get dependencies again
        run: flutter pub get

      - name: Create release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore android/release-key.jks \
            -alias kyamusoni \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Kyamusoni, OU=Mobile, O=Kyamusoni, L=Kampala, ST=Central, C=UG"

      - name: Create key properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=kyamusoni
          storeFile=release-key.jks
          EOF

      - name: Build signed armeabi-v7a APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm \
            --split-per-abi \
            --verbose

      - name: Find armeabi-v7a APK
        run: |
          echo "===== GENERATED APK FILES ====="
          find build -type f -name "*.apk" -print

          APK="build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: armeabi-v7a APK was not generated."
            echo "===== BUILD DIRECTORY ====="
            find build -type f -print || true
            exit 1
          fi

          mkdir -p build/app/outputs/flutter-apk/final
          cp "$APK" build/app/outputs/flutter-apk/final/app-armeabi-v7a-release.apk

          echo "===== FINAL APK ====="
          ls -lh build/app/outputs/flutter-apk/final/app-armeabi-v7a-release.apk

      - name: Verify APK signature
        run: |
          APK="build/app/outputs/flutter-apk/final/app-armeabi-v7a-release.apk"

          echo "===== APK SIGNATURE ====="
          jarsigner -verify -verbose -certs "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: kyamusoni-armeabi-v7a-release
          path: build/app/outputs/flutter-apk/final/app-armeabi-v7a-release.apk
          if-no-files-found: error
