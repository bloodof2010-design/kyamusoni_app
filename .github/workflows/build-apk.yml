name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Clean Flutter
        run: flutter clean

      - name: Get dependencies again
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --verbose 2>&1 | tee build.log

      - name: Show APK files
        if: always()
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print
          echo "===== BUILD DIRECTORY ====="
          find build -type f -print 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kyamusoni-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
