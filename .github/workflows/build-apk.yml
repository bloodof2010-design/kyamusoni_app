name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Clean Flutter
        run: flutter clean

      - name: Get dependencies again
        run: flutter pub get

      - name: Create release keystore
        id: keystore
        continue-on-error: true
        run: |
          mkdir -p android

          keytool -genkeypair \
            -v \
            -keystore android/release-key.jks \
            -alias kyamusoni \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "KyamusoniStore2026" \
            -keypass "KyamusoniKey2026" \
            -dname "CN=Kyamusoni, OU=Mobile, O=Kyamusoni, L=Kampala, ST=Central, C=UG" \
            2>&1 | tee keystore.log

          exit ${PIPESTATUS[0]}

      - name: Report keystore error
        if: steps.keystore.outcome == 'failure'
        run: |
          echo "========================================"
          echo "       KEYSTORE CREATION FAILED"
          echo "========================================"
          echo ""
          cat keystore.log
          echo ""
          echo "========================================"
          exit 1

      - name: Create key properties
        run: |
          cat > android/key.properties <<'EOF'
          storePassword=KyamusoniStore2026
          keyPassword=KyamusoniKey2026
          keyAlias=kyamusoni
          storeFile=release-key.jks
          EOF

      - name: Build signed armeabi-v7a APK
        id: build
        continue-on-error: true
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm \
            --split-per-abi \
            2>&1 | tee build.log

          exit ${PIPESTATUS[0]}

      - name: Report build error
        if: steps.build.outcome == 'failure'
        run: |
          echo "========================================"
          echo "          APK BUILD FAILED"
          echo "========================================"
          echo ""
          echo "===== LAST 200 LINES ====="
          tail -n 200 build.log
          echo ""
          echo "========================================"
          exit 1

      - name: Find armeabi-v7a APK
        run: |
          echo "===== GENERATED APK FILES ====="
          find build -type f -name "*.apk" -print

          APK="build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: armeabi-v7a APK was not generated."
            exit 1
          fi

          mkdir -p build/app/outputs/flutter-apk/final
          cp "$APK" build/app/outputs/flutter-apk/final/app-armeabi-v7a-release.apk

          echo "===== FINAL APK ====="
          ls -lh build/app/outputs/flutter-apk/final/app-armeabi-v7a-release.apk

      - name: Verify APK signature
        id: verify
        continue-on-error: true
        run: |
          APK="build/app/outputs/flutter-apk/final/app-armeabi-v7a-release.apk"

          jarsigner -verify -verbose -certs "$APK" 2>&1 | tee signature.log

          exit ${PIPESTATUS[0]}

      - name: Report signature error
        if: steps.verify.outcome == 'failure'
        run: |
          echo "========================================"
          echo "       APK SIGNATURE VERIFICATION FAILED"
          echo "========================================"
          cat signature.log
          echo "========================================"
          exit 1

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: kyamusoni-armeabi-v7a-release
          path: build/app/outputs/flutter-apk/final/app-armeabi-v7a-release.apk
          if-no-files-found: error
