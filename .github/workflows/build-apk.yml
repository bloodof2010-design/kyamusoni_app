name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Clean
        run: flutter clean

      - name: Dependencies again
        run: flutter pub get

      - name: Create signing key
        run: |
          set -e

          rm -f android/release-key.jks
          rm -f android/key.properties

          keytool -genkeypair -v \
            -keystore android/release-key.jks \
            -alias kyamusoni \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass KyamusoniStore2026 \
            -keypass KyamusoniStore2026 \
            -dname "CN=Kyamusoni, OU=Mobile, O=Kyamusoni, L=Kampala, ST=Central, C=UG"

      - name: Verify signing key
        run: |
          set -e

          keytool -list \
            -keystore android/release-key.jks \
            -storepass KyamusoniStore2026 \
            -alias kyamusoni

      - name: Create signing properties
        run: |
          set -e

          printf '%s\n' \
            'storePassword=KyamusoniStore2026' \
            'keyPassword=KyamusoniStore2026' \
            'keyAlias=kyamusoni' \
            'storeFile=release-key.jks' \
            > android/key.properties

      - name: Generate Gradle wrapper
        run: |
          set +e

          echo "========================================"
          echo "       GENERATING GRADLE WRAPPER"
          echo "========================================"

          cd android

          gradle wrapper --gradle-version 8.14 \
            2>&1 | tee ../wrapper-build.log

          CODE=${PIPESTATUS[0]}

          cd ..

          if [ "$CODE" -ne 0 ]; then
            echo ""
            echo "===== GRADLE WRAPPER GENERATION FAILED ====="
            echo ""
            if [ -f wrapper-build.log ]; then
              tail -n 200 wrapper-build.log
            fi
            exit "$CODE"
          fi

          chmod +x android/gradlew

          echo ""
          echo "===== GRADLE WRAPPER CREATED ====="
          ls -lh android/gradlew
          ls -lh android/gradle/wrapper/

      - name: Check Gradle wrapper
        run: |
          set -e

          echo "===== GRADLE WRAPPER ====="

          if [ ! -f android/gradlew ]; then
            echo "ERROR: android/gradlew does not exist."
            exit 1
          fi

          chmod +x android/gradlew

          ls -lh android/gradlew

      - name: Build APK with Gradle
        id: build_apk
        continue-on-error: true
        run: |
          set +e

          echo "========================================"
          echo "       STARTING GRADLE BUILD"
          echo "========================================"

          cd android

          ./gradlew app:assembleRelease \
            --stacktrace \
            --warning-mode all \
            --no-daemon \
            2>&1 | tee ../gradle-build.log

          CODE=${PIPESTATUS[0]}

          cd ..

          echo ""
          echo "========================================"
          echo "       GRADLE EXIT CODE: $CODE"
          echo "========================================"

          if [ "$CODE" -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "       GRADLE BUILD FAILED"
            echo "========================================"

            if [ -f gradle-build.log ]; then
              echo ""
              echo "===== LAST 300 LINES ====="
              tail -n 300 gradle-build.log
            else
              echo "ERROR: gradle-build.log was not created."
            fi

            echo ""
            echo "========================================"
            echo "       END GRADLE ERROR REPORT"
            echo "========================================"

            exit "$CODE"
          fi

          echo ""
          echo "========================================"
          echo "       GRADLE BUILD SUCCESSFUL"
          echo "========================================"

          echo ""
          echo "===== SEARCHING FOR APK FILES ====="
          find . -type f -name "*.apk" -print

      - name: Report Gradle failure
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo "========================================"
          echo "       FINAL GRADLE ERROR REPORT"
          echo "========================================"

          if [ -f gradle-build.log ]; then
            echo ""
            echo "===== LAST 300 LINES ====="
            tail -n 300 gradle-build.log
          else
            echo "ERROR: gradle-build.log was not created."
          fi

          echo ""
          echo "========================================"
          echo "       END ERROR REPORT"
          echo "========================================"

          exit 1

      - name: Locate armeabi-v7a APK
        run: |
          set -e

          echo "========================================"
          echo "       SEARCHING FOR GENERATED APK"
          echo "========================================"

          echo ""
          echo "===== ALL APK FILES ====="
          find . -type f -name "*.apk" -print

          APK=$(find . -type f -name "*.apk" \
            \( -iname "*armeabi-v7a*" -o -iname "*armeabi_v7a*" \) \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: No armeabi-v7a APK was found."
            echo ""
            echo "===== COMPLETE APK SEARCH ====="
            find . -type f -name "*.apk" -print
            exit 1
          fi

          echo ""
          echo "FOUND:"
          echo "$APK"

          mkdir -p final-apk

          cp "$APK" final-apk/app-armeabi-v7a-release.apk

          echo ""
          echo "===== FINAL APK ====="
          ls -lh final-apk/app-armeabi-v7a-release.apk

      - name: Verify APK signature
        run: |
          set -e

          APK="final-apk/app-armeabi-v7a-release.apk"

          echo "========================================"
          echo "       VERIFYING APK SIGNATURE"
          echo "========================================"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$APK"

      - name: Verify APK contents
        run: |
          set -e

          APK="final-apk/app-armeabi-v7a-release.apk"

          echo "========================================"
          echo "       APK FINAL VERIFICATION"
          echo "========================================"

          ls -lh "$APK"

          unzip -t "$APK" >/dev/null

          echo "APK archive is valid."

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: kyamusoni-armeabi-v7a-release
          path: final-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
