       name: Build APK
        run: 
          set +e
          cd android
          gradle app:assembleRelease --stacktrace > ../build.log 2>&1
          status=$?
          cd ..

          echo "===== ERROR REPORT ====="
          grep -n -E "FAILURE:|What went wrong:|Execution failed|AAPT: error:|Android resource linking failed|Could not|Error:|Caused by:" build.log | tail -100 || true

          echo "===== APK REPORT ====="
          find android -type f -name "*.apk" -print || true

          echo "===== EXIT CODE ====="
          echo "$status"

          if [ $status -ne 0 ]; then
            echo "===== LAST 100 LINES ====="
            tail -100 build.log
            exit $status
          fi
