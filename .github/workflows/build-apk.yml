      - name: Build APK with Gradle
        id: build_apk
        continue-on-error: true
        run: |
          cd android
          chmod +x gradlew
          ./gradlew app:assembleRelease --stacktrace --info
          cd ..

      - name: Report Gradle error
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo "========================================"
          echo "       GRADLE APK BUILD FAILED"
          echo "========================================"
          echo ""
          echo "===== GRADLE OUTPUT ====="
          cd android
          ./gradlew app:assembleRelease --stacktrace 2>&1 | tail -n 300
          exit 1

      - name: Find APK
        run: |
          echo "Searching for generated APK..."
          find . -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          mkdir -p build/app/outputs/flutter-apk

          APK=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No release APK found."
            find android/app/build -type f -print || true
            exit 1
          fi

          echo "APK found at: $APK"
          cp "$APK" build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kyamusoni-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
