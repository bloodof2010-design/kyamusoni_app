name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Clean
        run: flutter clean

      - name: Get dependencies again
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release --verbose 2>&1 | tee build.log

      - name: Find and prepare APK
        run: |
          echo "===== SEARCHING FOR APK ====="
          find . -type f -name "*.apk" -print

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            echo "===== LAST BUILD LOG ====="
            tail -n 300 build.log
            exit 1
          fi

          echo "APK FOUND: $APK"

          mkdir -p release
          cp "$APK" release/app-release.apk

          echo "===== FINAL APK ====="
          ls -lh release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kyamusoni-release-apk
          path: release/app-release.apk
          if-no-files-found: error
