      - name: Build signed armeabi-v7a APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail

          cd android

          chmod +x gradlew

          ./gradlew app:assembleRelease \
            --stacktrace \
            --no-daemon \
            2>&1 | tee ../gradle-build.log

          EXIT_CODE=${PIPESTATUS[0]}

          cd ..

          echo "GRADLE_EXIT_CODE=$EXIT_CODE"

          exit $EXIT_CODE

      - name: Report Gradle build error
        if: steps.build.outcome == 'failure'
        run: |
          echo "========================================"
          echo "       GRADLE APK BUILD FAILED"
          echo "========================================"
          echo ""
          echo "===== LAST 250 LINES ====="
          tail -n 250 gradle-build.log
          echo ""
          echo "===== IMPORTANT ERRORS ====="
          grep -n -E \
            "FAILURE:|What went wrong:|Execution failed|KeytoolException|Given final block|BUILD FAILED|Caused by:|Error:" \
            gradle-build.log | tail -n 100 || true
          echo ""
          echo "========================================"
          exit 1

      - name: Find generated APK
        id: find_apk
        run: |
          echo "========================================"
          echo "       SEARCHING FOR GENERATED APK"
          echo "========================================"

          find . -type f -name "*.apk" -print

          APK=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: Gradle completed but no APK was found."
            echo ""
            echo "===== ANDROID BUILD FILES ====="
            find android/app/build -type f -print 2>/dev/null || true
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          mkdir -p build/app/outputs/flutter-apk/final

          cp "$APK" \
            build/app/outputs/flutter-apk/final/app-armeabi-v7a-release.apk

          echo ""
          echo "===== FINAL APK ====="
          ls -lh build/app/outputs/flutter-apk/final/app-armeabi-v7a-release.apk
