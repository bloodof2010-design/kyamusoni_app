name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK and Report Errors
        run: |
          set +e
          flutter build apk --release --android-skip-build-dependency-validation > build.log 2>&1
          status=$?

          echo "===== ERROR REPORT ====="
          grep -n -E "FAILURE:|What went wrong:|Execution failed|Android resource linking failed|AAPT: error:|Gradle build failed|Error:|Caused by:" build.log | tail -100 || true

          echo "===== APK REPORT ====="
          find . -type f -name "*.apk" -print || true

          echo "===== EXIT CODE ====="
          echo "$status"

          exit $status

      - name: Collect APK
        uses: actions/upload-artifact@v4
        with:
          name: kyamusoni-release-apk
          path: android/app/build/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
