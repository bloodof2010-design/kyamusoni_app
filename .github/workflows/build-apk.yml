      - name: Build APK with Gradle
        run: |
          set +e

          cd android

          ./gradlew app:assembleRelease \
            --stacktrace \
            --warning-mode all \
            --no-daemon

          CODE=$?

          cd ..

          echo ""
          echo "===== BUILD OUTPUT ====="
          find build -type f -print 2>/dev/null || true

          echo ""
          echo "===== ANDROID OUTPUT ====="
          find android/app/build -type f -print 2>/dev/null || true

          echo ""
          echo "===== APK OUTPUT DIRECTORY ====="
          ls -lah build/app/outputs/flutter-apk/ 2>/dev/null || true
          ls -lah android/app/build/outputs/apk/release/ 2>/dev/null || true

          exit "$CODE"
