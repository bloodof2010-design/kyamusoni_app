name: Regenerate Android

on:
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Check Android wrapper
        run: |
          ls -lh android/gradle/wrapper/
          test -s android/gradle/wrapper/gradle-wrapper.jar

      - name: Commit Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git commit -m "Regenerate Flutter Android project" || echo "Nothing to commit"
          git push
