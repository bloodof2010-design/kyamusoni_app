name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Android files
        run: |
          flutter precache
          flutter build apk --debug --no-pub

      - name: Build APK Release with full errors
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace --info 2>&1 | tee build.log
          cd ..
          cp build/app/outputs/flutter-apk/app-release.apk . || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
          if-no-files-found: warn

      - name: Show Error Summary
        if: failure()
        run: |
          echo "==== LAST 100 LINES OF ERROR ===="
          tail -n 100 android/build.log
