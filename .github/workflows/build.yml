name: Build Flutter APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.0', channel: 'stable'}
      - run: flutter pub get
      
      - name: Manually install Gradle 8.12.1
        run: |
          cd android
          wget https://services.gradle.org/distributions/gradle-8.12.1-all.zip
          unzip gradle-8.12.1-all.zip -d ~/.gradle/wrapper/dists/
          rm gradle-8.12.1-all.zip
          
      - name: Build with Gradle 8.12.1
        run: |
          cd android
          ~/.gradle/wrapper/dists/gradle-8.12.1/bin/gradle assembleRelease
          cd ..
          cp build/app/outputs/flutter-apk/app-release.apk .
