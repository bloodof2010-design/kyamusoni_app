name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Manually install Gradle 8.12.1 + Build APK
        run: |
          cd android
          mkdir -p ~/.gradle/wrapper/dists/
          wget https://services.gradle.org/distributions/gradle-8.12.1-all.zip
          unzip gradle-8.12.1-all.zip -d ~/.gradle/wrapper/dists/
          rm gradle-8.12.1-all.zip
          ~/.gradle/wrapper/dists/gradle-8.12.1/bin/gradle :app:assembleRelease --stacktrace
          cd ..
          cp build/app/outputs/flutter-apk/app-release.apk .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
