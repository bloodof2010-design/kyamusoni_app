name: Build Flutter APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.0', channel: 'stable'}
      - run: flutter pub get
      - name: Manually install Gradle 8.12.1 + Build APK
        run: |
          cd android
          mkdir -p ~/.gradle/wrapper/dists/
          wget https://services.gradle.org/distributions/gradle-8.12.1-all.zip
          unzip gradle-8.12.1-all.zip -d ~/.gradle/wrapper/dists/
          rm gradle-8.12.1-all.zip
          ~/.gradle/wrapper/dists/gradle-8.12.1/bin/gradle :app:assembleRelease
          cd ..
          cp build/app/outputs/flutter-apk/app-release.apk .
      - uses: actions/upload-artifact@v4
        with: {name: app-release, path: app-release.apk}
