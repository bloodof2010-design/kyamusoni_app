- name: Manually install Gradle 8.12.1 + Build APK
  run: |
    cd android
    mkdir -p ~/.gradle/wrapper/dists/
    wget https://services.gradle.org/distributions/gradle-8.12.1-all.zip
    unzip gradle-8.12.1-all.zip -d ~/.gradle/wrapper/dists/
    rm gradle-8.12.1-all.zip
    ~/.gradle/wrapper/dists/gradle-8.12.1/bin/gradle :app:assembleRelease --stacktrace --info 2>&1 | tee build.log || true
    cd ..
    echo "==== ERROR SUMMARY ===="
    grep -A 50 "What went wrong" build.log || grep -A 50 "FAILED" build.log || tail -n 100 build.log
    cp build/app/outputs/flutter-apk/app-release.apk .
