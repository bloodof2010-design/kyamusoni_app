plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.kyamusoni_app"  // <- fixed: no = sign
    compileSdk 35                          // <- fixed: hardcode 35

    defaultConfig {
        applicationId "com.example.kyamusoni_app"
        minSdk 21
        targetSdk 35
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}
