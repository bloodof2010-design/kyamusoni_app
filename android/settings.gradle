pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = file("local.properties")

        if (!localPropertiesFile.exists()) {
            throw new GradleException(
                "android/local.properties is missing. Run 'flutter pub get' first."
            )
        }

        localPropertiesFile.withInputStream { properties.load(it) }

        def flutterSdkPath = properties.getProperty("flutter.sdk")

        if (flutterSdkPath == null || flutterSdkPath.trim().isEmpty()) {
            throw new GradleException(
                "flutter.sdk is not set in android/local.properties."
            )
        }

        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.7.3" apply false
    id "org.jetbrains.kotlin.android" version "2.0.20" apply false
}

include ":app"
