pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = new File(settingsDir, "local.properties")
        
        // 1. Try local.properties (local PC)
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { properties.load(it) }
            def sdkPath = properties.getProperty("flutter.sdk")
            if (sdkPath != null && new File(sdkPath).exists()) {
                return sdkPath
            }
        }
        
        // 2. Try env vars (GitHub Actions)
        def envPath = System.getenv("FLUTTER_ROOT") ?: System.getenv("FLUTTER_HOME")
        if (envPath != null && new File(envPath).exists()) {
            return envPath
        }
        
        // 3. Fallback for GitHub hosted runner
        return null
    }()

    if (flutterSdkPath != null) {
        includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
    }

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include ":app"
